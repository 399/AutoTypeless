name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run core tests
        run: swift test

      - name: Build Apple Silicon executable
        run: swift build -c release --product AutoTypelessMenuBar --arch arm64

      - name: Package Apple Silicon DMG
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ARCH: arm64
          ASSET_SUFFIX: -Apple-Silicon
        run: zsh scripts/package-dmg.sh

      - name: Build Intel executable
        run: swift build -c release --product AutoTypelessMenuBar --arch x86_64

      - name: Package Intel DMG
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ARCH: x86_64
          ASSET_SUFFIX: -Intel
        run: zsh scripts/package-dmg.sh

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          shasum -a 256 "AutoTypeless-${{ steps.version.outputs.version }}-Apple-Silicon.dmg" > "AutoTypeless-${{ steps.version.outputs.version }}-Apple-Silicon.dmg.sha256"
          shasum -a 256 "AutoTypeless-${{ steps.version.outputs.version }}-Intel.dmg" > "AutoTypeless-${{ steps.version.outputs.version }}-Intel.dmg.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/AutoTypeless-${{ steps.version.outputs.version }}-Apple-Silicon.dmg" \
              "dist/AutoTypeless-${{ steps.version.outputs.version }}-Apple-Silicon.dmg.sha256" \
              "dist/AutoTypeless-${{ steps.version.outputs.version }}-Intel.dmg" \
              "dist/AutoTypeless-${{ steps.version.outputs.version }}-Intel.dmg.sha256" \
              --clobber
          else
            gh release create "$TAG" \
              "dist/AutoTypeless-${{ steps.version.outputs.version }}-Apple-Silicon.dmg" \
              "dist/AutoTypeless-${{ steps.version.outputs.version }}-Apple-Silicon.dmg.sha256" \
              "dist/AutoTypeless-${{ steps.version.outputs.version }}-Intel.dmg" \
              "dist/AutoTypeless-${{ steps.version.outputs.version }}-Intel.dmg.sha256" \
              --target "$GITHUB_SHA" \
              --title "AutoTypeless ${{ steps.version.outputs.version }}" \
              --generate-notes
          fi
